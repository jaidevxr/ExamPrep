name: Keep Supabase Awake

on:
  schedule:
    # Runs every 3 days at 00:00 UTC to prevent Supabase auto-pausing (which triggers after 7 days)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY secret is missing in GitHub Repository Secrets!"
            echo "Please add SUPABASE_URL and SUPABASE_ANON_KEY under Settings > Secrets and variables > Actions"
            exit 1
          fi
          
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/")
          
          echo "Supabase HTTP Response Status: $STATUS"
          
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
            echo "Successfully pinged Supabase project. Project will remain active!"
          else
            echo "::error::Unexpected HTTP status $STATUS when pinging Supabase."
            exit 1
          fi
